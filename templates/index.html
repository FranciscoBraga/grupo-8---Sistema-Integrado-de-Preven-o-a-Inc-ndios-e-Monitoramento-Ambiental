<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SIPIMA</title>
<link rel="stylesheet" href="/static/sipima.css">
</head>
<body>
<div class="topo">SIPIMA - Prevenção a Incêndios e Monitoramento Ambiental</div>

<div class="coluna">
  <h3>Sensores</h3>
  <div id="sensores"></div>
  <h3>Simular leitura</h3>
  sensor <input id="sid" size="3"> valor <input id="val" size="5">
  <button onclick="enviarLeitura()">enviar</button>
</div>

<div class="coluna">
  <h3>Alarmes</h3>
  <div id="alarmes"></div>
  <audio id="sirene" src="/static/sirene.mp3"></audio>
</div>

<div class="coluna">
  <h3>Extintores a vencer</h3>
  <div id="extintores"></div>
  <h3>Rota de fuga</h3>
  prédio <input id="fpredio" size="3"> andar do fogo <input id="fandar" size="3">
  <button onclick="rota()">calcular</button>
  <ol id="rota"></ol>
</div>

<script src="/static/sipima.js"></script>
</body>
</html>
